name: Sync Docs to Confluence

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill all documentation files at once'
        required: false
        type: boolean
        default: false
      space_key:
        description: 'Override Confluence Space Key (e.g. OOP)'
        required: false
        type: string
        default: ''
      parent_title:
        description: 'Override Parent Page Title'
        required: false
        type: string
        default: ''

jobs:
  sync:
    name: Sync Markdown & Mermaid to Confluence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js (for Mermaid CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install -g @mermaid-js/mermaid-cli
          pip install markdown requests

      - name: Determine Changed Files
        id: files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.backfill }}" = "true" ]; then
            echo "mode=backfill" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            echo "mode=backfill" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- '**.md' '**.mdx' || true)
            if [ -z "$CHANGED" ]; then
              echo "mode=backfill" >> $GITHUB_OUTPUT
            else
              echo "mode=diff" >> $GITHUB_OUTPUT
              echo "files<<EOF" >> $GITHUB_OUTPUT
              echo "$CHANGED" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run Confluence Sync
        env:
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL || 'https://vikash1a2b3c.atlassian.net/wiki' }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_KEY: ${{ secrets.ATLASSIAN_API_KEY }}
          CONFLUENCE_SPACE_KEY: ${{ inputs.space_key || secrets.CONFLUENCE_SPACE_KEY || 'OOP' }}
          CONFLUENCE_PARENT_TITLE: ${{ inputs.parent_title || secrets.CONFLUENCE_PARENT_TITLE || '' }}
        run: |
          if [ "${{ steps.files.outputs.mode }}" = "backfill" ]; then
            echo "Running full documentation backfill..."
            python scripts/sync_confluence.py --backfill
          else
            echo "Syncing changed files..."
            FILES=$(echo "${{ steps.files.outputs.files }}" | tr '\n' ' ')
            python scripts/sync_confluence.py --files $FILES
          fi
